  <script>
    (() => {
      const metricValues = document.querySelectorAll("[data-metric-value]");
      const formatCurrency = (value) => new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 }).format(value);
      const formatCount = (value) => new Intl.NumberFormat("ja-JP").format(value);
      metricValues.forEach((element) => {
        const rawValue = Number(element.dataset.rawValue);
        if (!Number.isFinite(rawValue)) return;
        element.textContent = element.dataset.kind === "currency" ? formatCurrency(rawValue) : formatCount(rawValue);
      });
