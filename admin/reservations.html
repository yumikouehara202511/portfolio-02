  <script>
    (() => {
      const pendingFilter = document.querySelector("[data-pending-filter]");
      const rows = document.querySelectorAll(".reservation-table__row");
      rows.forEach((row) => {
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            row.click();
          }
        });
      });
      if (!pendingFilter) return;
      pendingFilter.addEventListener("change", () => {
        rows.forEach((row) => {
          row.hidden = pendingFilter.checked && !row.hasAttribute("data-pending-row");
        });
      });
    })();
  </script>
