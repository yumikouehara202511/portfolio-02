        { date: "2026-04-28", currentMonth: true, items: [{ time: "13:30", label: "予約あり", type: "booked" }] },
        { date: "2026-04-29", currentMonth: true, items: [{ time: "11:00", label: "空き枠あり", type: "open" }] },
        { date: "2026-04-30", currentMonth: true, items: [{ time: "15:30", label: "予約あり", type: "booked" }] },
        { date: "2026-05-01", currentMonth: false, items: [] },
        { date: "2026-05-02", currentMonth: false, items: [] },
        { date: "2026-05-03", currentMonth: false, items: [] }
      ];

      const statusMap = {
        open: { label: "\u7a7a\u304d", className: "status-chip status-chip--pending" },
        closed: { label: "\u30af\u30ed\u30fc\u30ba", className: "status-chip status-chip--cancelled" }
      };
      const bookedStatusMap = {
        "\u78ba\u5b9a": "status-chip status-chip--confirmed",
        "\u672a\u5bfe\u5fdc": "status-chip status-chip--pending",
        "\u30ad\u30e3\u30f3\u30bb\u30eb": "status-chip status-chip--cancelled"
      };
      const modal = document.querySelector("[data-schedule-modal]");
      const modalSummary = document.querySelector("[data-modal-summary]");
      const modalName = document.querySelector("[data-modal-name]");
      const modalTime = document.querySelector("[data-modal-time]");
      const modalGuests = document.querySelector("[data-modal-guests]");
      const modalNote = document.querySelector("[data-modal-note]");
      const modalStatusWrap = document.querySelector("[data-modal-status-wrap]");
      const closeTriggers = document.querySelectorAll("[data-schedule-close]");
      const tabButtons = document.querySelectorAll("[data-schedule-tab]");
      const listView = document.querySelector("[data-schedule-list-view]");
      const calendarView = document.querySelector("[data-schedule-calendar-view]");
      const dayLabel = document.querySelector("[data-schedule-day-label]");
      const dayTitle = document.querySelector("[data-schedule-day-title]");
      const dayMeta = document.querySelector("[data-schedule-day-meta]");
      const slotList = document.querySelector("[data-schedule-slot-list]");
      const calendarGrid = document.querySelector("[data-schedule-calendar-grid]");
      let activeTab = "today";

      const openBookedModal = (slot) => {
        if (!modal) return;
        const name = slot.dataset.name || "";
        const time = slot.dataset.time || "";
        const guests = slot.dataset.guests || "";
        const note = slot.dataset.note || "-";
        const status = slot.dataset.status || "\u78ba\u5b9a";
        const statusClass = bookedStatusMap[status] || "status-chip status-chip--confirmed";

        if (modalSummary) modalSummary.textContent = time + " / " + guests;
        if (modalName) modalName.textContent = name;
        if (modalTime) modalTime.textContent = time;
        if (modalGuests) modalGuests.textContent = guests;
        if (modalNote) modalNote.textContent = note;
        if (modalStatusWrap) modalStatusWrap.innerHTML = '<span class="' + statusClass + '">' + status + "</span>";

        modal.hidden = false;
        document.body.classList.add("is-modal-open");
      };

      const closeModal = () => {
        if (!modal) return;
        modal.hidden = true;
        document.body.classList.remove("is-modal-open");
      };

      const renderSlots = (key) => {
        if (!slotList || !scheduleData[key]) return;
        const current = scheduleData[key];
        if (dayLabel) dayLabel.textContent = current.label;
        if (dayTitle) dayTitle.textContent = current.title;
        if (dayMeta) dayMeta.textContent = current.meta;

        slotList.innerHTML = current.slots.map((slot) => {
          if (slot.kind === "booked") {
            return `
              <button class="schedule-slot-item" type="button" data-slot-kind="booked" data-name="${slot.name}" data-time="${current.title.split(" ")[0]} ${slot.time}" data-guests="${slot.guests}" data-note="${slot.note}" data-status="${slot.status}">
                <div class="schedule-slot-item__main">
                  <p class="schedule-slot-item__time">${slot.time}</p>
                  <p class="schedule-slot-item__hint">&#12479;&#12483;&#12503;&#12391;&#20104;&#32004;&#35443;&#32048;&#12434;&#38283;&#12367;</p>
                </div>
                <div class="schedule-slot-item__side">
                  <span class="status-chip status-chip--confirmed">&#20104;&#32004;&#12354;&#12426;</span>
                  <p class="schedule-slot-item__customer">${slot.name}</p>
                </div>
              </button>
            `;
          }

          const statusClass = slot.state === "closed" ? "status-chip status-chip--cancelled" : "status-chip status-chip--pending";
          const statusLabel = slot.state === "closed" ? "&#12463;&#12525;&#12540;&#12474;" : "&#31354;&#12365;";
          return `
            <button class="schedule-slot-item" type="button" data-slot-kind="toggle" data-state="${slot.state}">
              <div class="schedule-slot-item__main">
                <p class="schedule-slot-item__time">${slot.time}</p>
                <p class="schedule-slot-item__hint">&#31354;&#12365;&#12392;&#12463;&#12525;&#12540;&#12474;&#12434;&#12479;&#12483;&#12503;&#12391;&#20999;&#12426;&#26367;&#12360;</p>
              </div>
              <div class="schedule-slot-item__side">
                <span class="${statusClass}" data-slot-status>${statusLabel}</span>
              </div>
            </button>
          `;
        }).join("");
      };

      const renderCalendar = () => {
        if (!calendarGrid) return;
        calendarGrid.innerHTML = calendarData.map((day) => {
          const date = new Date(day.date + "T00:00:00");
          const dayNumber = String(date.getDate());
          const dayClasses = [
            "schedule-calendar__day",
            day.currentMonth ? "" : "schedule-calendar__day--muted",
            day.date === "2026-04-17" ? "schedule-calendar__day--today" : ""
          ].filter(Boolean).join(" ");
          const countLabel = day.items.length ? `${day.items.length}件` : "";
          const items = day.items.length
            ? day.items.slice(0, 2).map((item) => `
                <div class="schedule-calendar__item schedule-calendar__item--${item.type}">
                  <div class="schedule-calendar__item-time">${item.time}</div>
                  <div class="schedule-calendar__item-name">${item.label}</div>
                </div>
              `).join("")
            : `<div class="schedule-calendar__meta">&#31354;&#12365;&#29366;&#27841;&#12398;&#35352;&#37682;&#12394;&#12375;</div>`;

          return `
            <article class="${dayClasses}">
              <div class="schedule-calendar__date">${dayNumber}</div>
              <div class="schedule-calendar__meta">${countLabel}</div>
              <div class="schedule-calendar__list">${items}</div>
            </article>
          `;
        }).join("");
      };

      const bindSlotEvents = () => {
        const slots = document.querySelectorAll(".schedule-slot-item");
        slots.forEach((slot) => {
          slot.addEventListener("click", () => {
            if (slot.dataset.slotKind === "booked") {
              openBookedModal(slot);
              return;
            }

            const next = slot.dataset.state === "closed" ? "open" : "closed";
            slot.dataset.state = next;
            const status = slot.querySelector("[data-slot-status]");

            if (status) {
              status.className = statusMap[next].className;
              status.textContent = statusMap[next].label;
            }
          });
        });
      };

      const setActiveTab = (key) => {
        activeTab = key;
        tabButtons.forEach((button) => {
          const isActive = button.dataset.scheduleTab === key;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });

        const isCalendar = key === "calendar";
        if (listView) listView.hidden = isCalendar;
        if (calendarView) calendarView.hidden = !isCalendar;

        if (isCalendar) {
          renderCalendar();
          return;
        }

        renderSlots(key);
        bindSlotEvents();
      };

      closeTriggers.forEach((trigger) => {
        trigger.addEventListener("click", closeModal);
      });

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setActiveTab(button.dataset.scheduleTab);
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal && !modal.hidden) {
          closeModal();
        }
      });

      setActiveTab(activeTab);
    })();
  </script>
</body>
</html>
