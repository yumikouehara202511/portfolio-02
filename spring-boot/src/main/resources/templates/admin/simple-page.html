<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle + ' | MY SCENT BY INOWA'}">管理画面 | MY SCENT BY INOWA</title>
  <link rel="stylesheet" th:href="@{/assets/admin/css/admin-layout.css}">
</head>
<body>
  <div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"></aside>

    <div class="admin-layout__main">
      <header class="admin-layout__header">
        <div class="admin-layout__header-inner">
          <div class="admin-layout__header-copy">
            <p class="admin-layout__eyebrow">管理画面</p>
            <h1 class="admin-layout__title" th:text="${pageTitle}">管理画面</h1>
          </div>
        </div>
      </header>

      <main class="admin-layout__content">
        <section class="dashboard-card" aria-labelledby="simple-page-title">
          <div class="dashboard-card__head">
            <p class="dashboard-card__eyebrow" th:text="${pageEyebrow}">管理</p>
            <h2 class="dashboard-card__title" id="simple-page-title" th:text="${emptyTitle}">登録データはありません</h2>
            <p class="dashboard-card__submeta" th:text="${emptyText}">データが登録されるとここに表示されます。</p>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
