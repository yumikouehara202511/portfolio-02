  <script>
    (() => {
      const toggleText = {
        open: "&#31354;&#12365;",
        closed: "&#12463;&#12525;&#12540;&#12474;"
      };

      const toggleLabel = {
        open: "\u7a7a\u304d",
        closed: "\u30af\u30ed\u30fc\u30ba"
      };

      const toggleClass = {
        open: "status-chip status-chip--pending",
        closed: "status-chip status-chip--cancelled"
      };

      const slots = document.querySelectorAll(".schedule-slot-item");

      const updateToggleSlot = (slot) => {
        const status = slot.querySelector("[data-slot-status]");
        const time = slot.querySelector(".schedule-slot-item__time")?.textContent?.trim() || "";
        const state = slot.dataset.state === "closed" ? "closed" : "open";

        if (status) {
          status.className = toggleClass[state];
          status.innerHTML = toggleText[state];
        }

        slot.setAttribute(
          "aria-label",
          time + " " + toggleLabel[state] + " \u3092\u5207\u308a\u66ff\u3048"
        );
      };

      slots.forEach((slot) => {
        if (slot.dataset.slotKind === "toggle") {
          updateToggleSlot(slot);
        }

        slot.addEventListener("click", () => {
          if (slot.dataset.slotKind === "booked") {
            const href = slot.dataset.href;
            if (href) {
              window.location.href = href;
            }
            return;
          }

          slot.dataset.state = slot.dataset.state === "closed" ? "open" : "closed";
          updateToggleSlot(slot);
        });
      });
    })();
  </script>
