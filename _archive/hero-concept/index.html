<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>inowa Hero Concept</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero" data-hero>
    <div class="hero__bg" aria-hidden="true">
      <span class="hero__glow hero__glow--left"></span>
      <span class="hero__glow hero__glow--center"></span>
      <span class="hero__glow hero__glow--right"></span>
    </div>

    <div class="hero__inner">
      <section class="hero__content">
        <p class="hero__eyebrow">inowa eau de parfum</p>
        <h1 class="hero__title">香りをまとう、静かな余韻</h1>
        <p class="hero__text">
          日常にそっと寄り添う、やわらかな香り。肌の上でゆっくりとほどける、
          上質なフレグランス体験を。
        </p>
        <div class="hero__actions">
          <a href="#" class="hero__cta">View Collection</a>
        </div>
      </section>

      <div class="hero__visual" aria-hidden="true">
        <div class="perfume-bottle" data-bottle>
          <div class="perfume-bottle__cap"></div>
          <div class="perfume-bottle__neck"></div>

          <div class="perfume-bottle__glass">
            <div class="perfume-bottle__inner">
              <div class="perfume-bottle__liquid">
                <div class="perfume-bottle__surface"></div>
              </div>
            </div>

            <div class="perfume-bottle__label">
              <span class="perfume-bottle__brand">inowa</span>
              <span class="perfume-bottle__line">eau de parfum</span>
            </div>

            <div class="perfume-bottle__highlight perfume-bottle__highlight--left"></div>
            <div class="perfume-bottle__highlight perfume-bottle__highlight--right"></div>
          </div>

          <div class="perfume-bottle__shadow"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
